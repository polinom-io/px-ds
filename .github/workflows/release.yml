name: Release

# release-please keeps a release PR open on main with the next version and CHANGELOG.
# Merging it tags vX.Y.Z, creates the GitHub release, and this workflow then publishes
# @polinom-io/px-ds-react to GitHub Packages. Never bump versions or push tags by hand.
#
#   Dry run:  every pull request that touches the package or this workflow runs everything
#             except the publish, and shows what would be published.
#
# One version for every package (spec: lockstep releases); release-please updates the web
# package.json, the Flutter pubspec and the Flutter README together. A version with a hyphen
# (set with "Release-As: 0.2.0-rc.1" in a commit body) publishes under the npm dist-tag "next".
# release-please authenticates with the org GitHub App token, so checks run on release PRs
# without approval. Publishing runs here, gated on release_created. Tags and releases made
# with the App token DO trigger other workflows, so add no workflow on release or tags that
# repeats the publish.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/web/**'
      - 'tokens/**'
      - 'tools/**'
      - 'assets/fonts/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read         # the App token writes the tag, release and release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.PX_RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PX_RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  web:
    name: Publish @polinom-io/px-ds-react
    needs: release-please
    # Dry run on pull requests; real publish only when release-please just created a release.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # publish to GitHub Packages
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && needs.release-please.outputs.tag_name || '' }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check the tag matches the package version
        if: env.DRY_RUN == 'false'
        run: |
          version="$(node -p "require('./packages/web/package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match packages/web/package.json version $version. Check release-please-config.json extra-files."
            exit 1
          fi

      # pnpm 12 reads registry credentials only from the user config. GITHUB_TOKEN reads
      # @polinom-io packages (Biome config) with packages: read.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

      - run: pnpm install --frozen-lockfile

      # The same gates as CI, so nothing reaches the registry that main would reject.
      - name: Token build check
        run: node tools/build.mjs --check
      - run: pnpm --filter @polinom-io/px-ds-react typecheck
      - run: pnpm --filter @polinom-io/px-ds-react test
      - run: pnpm --filter @polinom-io/px-ds-react build

      - name: Show what would be published
        working-directory: packages/web
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          {
            echo "### Package contents"
            echo '```'
            tar -tzf "$RUNNER_TEMP"/polinom-io-px-ds-react-*.tgz | sed 's|^package/||' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Packages
        if: env.DRY_RUN == 'false'
        working-directory: packages/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pnpm 12 reads credentials only from the user config, never from the repository's .npmrc.
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          case "$TAG" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          pnpm publish --no-git-checks --access public --tag "$dist_tag"

