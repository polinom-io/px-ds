name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Tokens (build, verify, contrast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # The token build has no dependencies. Without this, setup-node sees "packageManager" in
          # package.json and tries to cache pnpm's store, which fails because pnpm is not installed.
          package-manager-cache: false

      # Regenerates every platform file in memory and fails if a committed generated file differs
      # from tokens/, if a token is missing a theme value, has a broken alias or a bad name, or if a
      # pair in tokens/contrast-pairs.json is under its WCAG minimum. The CVD report is informational.
      - name: Token build check
        run: |
          {
            echo '### Token build'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          node tools/build.mjs --check | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Unit tests for the token tools (same as `pnpm test`; pnpm isn't installed in this job).
      - name: Token tool tests
        run: node --test tools/*.test.mjs

  web:
    name: Web package (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # pnpm 12 reads registry credentials only from the user config. GITHUB_TOKEN reads
      # @polinom-io packages (Biome config) with packages: read.
      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm --filter @polinom-io/px-ds-react typecheck
      # Server render with no DOM, hydration as separate islands, axe-core, behaviour, stylesheet checks.
      - run: pnpm --filter @polinom-io/px-ds-react test
      - run: pnpm --filter @polinom-io/px-ds-react build

  flutter:
    name: Flutter package (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: packages/flutter/.fvmrc   # same SDK as local `fvm flutter`
          cache: true

      - run: flutter --version
      - run: flutter pub get
      # The first real compile of the generated tokens.g.dart.
      - run: flutter analyze
      - run: flutter test --exclude-tags gallery
      # Visual review: render every widget in the four themes with the real fonts.
      - name: Render the widget gallery
        run: flutter test --tags gallery --update-goldens
      # Also print it into the log as base64, for reviewers that can read logs but not artifacts.
      - name: Gallery as base64 (between markers)
        run: |
          echo "----- BEGIN gallery.png -----"
          base64 -w 4000 test/goldens/gallery.png
          echo "----- END gallery.png -----"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-gallery
          path: packages/flutter/test/goldens/
          if-no-files-found: error
