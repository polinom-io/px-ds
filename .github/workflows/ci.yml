name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Tokens (build, verify, contrast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # The token build has no dependencies. Without this, setup-node sees "packageManager" in
          # package.json and tries to cache pnpm's store, which fails because pnpm is not installed.
          package-manager-cache: false

      # Regenerates every platform file in memory and fails if a committed generated file differs
      # from tokens/, if a token is missing a theme value, has a broken alias or a bad name, or if a
      # pair in tokens/contrast-pairs.json is under its WCAG minimum. The CVD report is informational.
      - name: Token build check
        run: |
          {
            echo '### Token build'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          node tools/build.mjs --check | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  web:
    name: Web package (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version named in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @polinom-io/px-ds-react typecheck
      # Server render with no DOM, hydration as separate islands, axe-core, behaviour, stylesheet checks.
      - run: pnpm --filter @polinom-io/px-ds-react test
      - run: pnpm --filter @polinom-io/px-ds-react build

  flutter:
    name: Flutter package (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter --version
      - run: flutter pub get
      # The first real compile of the generated tokens.g.dart.
      - run: flutter analyze
      - run: flutter test --exclude-tags gallery
      # Visual review: render every widget in the four themes with the real fonts.
      - name: Render the widget gallery
        run: flutter test --tags gallery --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-gallery
          path: packages/flutter/test/goldens/
          if-no-files-found: error
