name: Dependency audit

# Dependabot creates no security alerts for this repo: pnpm 12 writes pnpm-lock.yaml as two
# YAML documents, which GitHub's dependency graph can't read. This job fills that gap.
# It runs weekly too, because new advisories appear without any code change.

on:
  pull_request:
    paths: ['pnpm-lock.yaml', '**/package.json', 'pnpm-workspace.yaml', '.github/workflows/audit.yml']
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Audits the lockfile, dev dependencies included: the package has no runtime
      # dependencies, so the risk is in the toolchain that builds what we publish.
      - run: pnpm audit --audit-level high
